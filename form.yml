---
cluster:
  - "cardinal"
form:
  - auto_modules_ansys
  - auto_accounts
  - bc_num_hours
  - bc_num_slots
  - num_cores
  - reserve_parallel_licenses
  - node_type
  - bc_vnc_resolution
  - bc_email_on_started
  - user_license_provider
  - extern_license_server
  - extern_license_file
attributes:
  auto_modules_ansys:
    default: false
    filter: "firstsolar"
    help: "This defines the version of ANSYS you want to load."
    label: "ANSYS version"
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    help: |
      Number of CPU cores per node (with 4.84 GB usable memory per core).
    min: 1 
    max: 96
    step: 1
  bc_num_slots:
    help: |
      Currently only Fluent and CFX have been tested to support multiple nodes.
  bc_vnc_resolution:
    required: true
  reserve_parallel_licenses:
    widget: check_box
    checked_value: 1
    unchecked_value: 0
    label: "Reserve ANSYS Parallel Licenses"
    help: |
      - Please ensure that enough parallel licenses are available for the
      number of nodes selected before starting the session.
  node_type:
    widget: select
    label: "Node type"
    help: |
      - **any** - (*1 to 96 cores*) Use any Cardinal node type. This reduces
        the wait time as there are no node requirements.
      - **vis** - (*1 to 96 cores*) Use the Cardinal node type that has an
        [NVIDIA H100 GPU](https://www.nvidia.com/en-us/data-center/h100/) with
        an X server running in the background. This utilizes the GPU for
        hardware accelerated 3D visualization. There are 32 nodes of this type.
      - **hugemem** - (*1 to 96 cores*) Use the Cardinal node type that has
        2 TB of available RAM. There are 16 nodes of this type.
        Requesting this node type always reserves entire nodes.
    options:
      - [
        'any', 'any',
        data-max-num-cores: 96,
        data-min-num-cores: 1,
        ]
      - [
        'vis', 'vis',
        data-max-num-cores: 96,
        data-min-num-cores: 1,
        ]
      - [
        'hugemem', 'hugemem',
        data-max-num-cores: 96,
        data-min-num-cores: 47,
        ]
  user_license_provider:
    widget: select
    label: "License provider"
    help: "Some users are required to provide their own license information"
    options:
      - [
          'I can use the OSC license', 'osc',
          data-hide-extern-license-server: true,
          data-hide-extern-license-file: true,
        ]
      - ['I need to use an external license', 'external']
  extern_license_server:
    label: "External License Server"
    placeholder: port@ip
  extern_license_file:
    label: "External License File"
    placeholder: port@ip

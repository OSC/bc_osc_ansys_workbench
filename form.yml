---
cluster:
  - "cardinal"
form:
  - auto_modules_ansys
  - auto_accounts
  - global_job_type
  - global_enable_mem
  - bc_num_slots
  - global_num_cores
  - global_mem
  - global_gpus
  - global_gpu_type
  - global_enable_debug
  - global_enable_vis
  - bc_num_hours
  - reserve_parallel_licenses
  - bc_vnc_resolution
  - bc_email_on_started
  - user_license_provider
  - extern_license_server
  - extern_license_file
  - global_default_values     # required if the global_job_type is used
attributes:
  auto_modules_ansys:
    default: false
    filter: \d+R\d-
    help: "This defines the version of Ansys you want to load."
    label: "Ansys version"
  bc_num_slots:
    help: |
      Currently only Fluent and CFX have been tested to support multiple nodes.
  bc_vnc_resolution:
    required: true
  reserve_parallel_licenses:
    widget: check_box
    checked_value: 1
    unchecked_value: 0
    label: "Reserve Ansys Parallel Licenses"
    help: |
      - Please ensure that enough parallel licenses are available for the
      number of nodes selected before starting the session.
  user_license_provider:
    widget: select
    label: "License provider"
    help: "Some users are required to provide their own license information."
    options:
      - [
          'I can use the OSC license', 'osc',
          data-hide-extern-license-server: true,
          data-hide-extern-license-file: true,
        ]
      - ['I need to use an external license', 'external']
  extern_license_server:
    label: "External License Server"
    placeholder: port@ip
  extern_license_file:
    label: "External License File"
    placeholder: port@ip
